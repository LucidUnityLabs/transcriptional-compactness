name: tests

# Automated verification gate (audit R07): unit + reference + backend +
# import + synthetic layers.  The POT backend integration test is
# MANDATORY here: requirements.txt installs POT and REQUIRE_POT=1 turns
# a missing/broken POT install into a collection-time failure instead of
# a silent skip (the scipy stub must never stand in for the pinned
# production solver in release verification).
#
# Numerical runtime controls are set before process startup (audit R04 /
# §8.7): deterministic hashing, single-threaded BLAS, non-interactive
# matplotlib.  Third-party actions are pinned to the full commit
# identifiers resolved during the audit (report E07/E08) so the workflow
# consumes fixed source identities, not moving tags.
#
# R06: this job consumes the closed macOS26/CPython3.14 arm64 wheel lock,
# including the exact source-built POT wheel retained under requirements/wheels.
# Local offline installation and real-backend tests were executed; this
# remote runner is a reproduction gate, not claimed as already executed.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  MPLBACKEND: Agg
  REQUIRE_POT: '1'

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes --find-links requirements/wheels -r requirements/core-cp314-macos-arm64.lock
          python -m pip check
      - name: Corrected drivers import cleanly
        run: |
          python -m py_compile experiments/lib/*.py
          python -m py_compile experiments/META_patient_level/run_corrected.py \
            experiments/HELDOUT_GSE131907/run_corrected.py \
            experiments/HELDOUT_GSE161529/run_corrected.py \
            experiments/HELDOUT_GSE161529/download_corrected.py \
            experiments/LABEL_VALIDATION/run_corrected.py \
            experiments/rerun_status.py
          python -m compileall -q tools
      - name: Audit dependency inventory (R06)
        run: python tools/import_inventory.py
      - name: Rerun status manifest is current
        run: |
          python experiments/rerun_status.py --check
      - name: Corrected drivers report blocked status (no data in CI)
        run: |
          set +e
          for d in experiments/HELDOUT_GSE131907/run_corrected.py \
                   experiments/HELDOUT_GSE161529/run_corrected.py \
                   experiments/META_patient_level/run_corrected.py \
                   experiments/LABEL_VALIDATION/run_corrected.py; do
            python "$d" >/dev/null 2>&1
            rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "FAIL: $d exited $rc (expected 2 = blocked, no data)"
              exit 1
            fi
          done
      - name: Full test suite (POT backend test mandatory)
        run: python -m pytest tests/ -v
      - name: Optimized-mode suite (production asserts disabled)
        run: python -O -m pytest tests/ -q
